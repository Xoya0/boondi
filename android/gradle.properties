# JVM tuning: this machine runs IDEs alongside the build, so keep the daemon heap
# bounded and cap metaspace/workers to avoid the native-memory OOM seen with the
# default 2 GiB heap + unbounded C2 compiler arenas.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
# Kotlin compile daemon: bound its heap too (separate JVM from the Gradle daemon).
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
