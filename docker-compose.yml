version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boondi
      POSTGRES_USER: boondi
      POSTGRES_PASSWORD: boondi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boondi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/boondi
      DB_USERNAME: boondi
      DB_PASSWORD: boondi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production-must-be-at-least-256-bits-long
      # Both point at container hostnames (docker-compose network), not localhost — the
      # backend runs inside its own container, so "localhost" would mean itself, not the
      # mailhog/minio containers.
      MAIL_HOST: mailhog
      STORAGE_ENDPOINT: http://minio:9000
      # Public URL clients (web browser, Android app) use to fetch uploaded media — must be
      # reachable from *outside* the Docker network, unlike STORAGE_ENDPOINT above. Falls
      # back to the useless http://localhost:9000 (see application.yml) if unset in .env.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Registered account emails to auto-promote to ADMIN at startup (see AdminSeedConfig).
      # Override per-machine: ADMIN_EMAILS=you@example.com docker compose up -d backend
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      # Host port 80 is often unavailable on Windows (IIS/http.sys reserve it) — 8081 is
      # only for direct host access (http://localhost:8081); the ngrok container reaches
      # this service over the internal Docker network at nginx:80 regardless of this mapping.
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # Tunnels the reserved domain (matching STORAGE_PUBLIC_URL/CORS_ORIGINS/APP_BASE_URL in
  # .env, and BASE_URL baked into the Android build) to nginx rather than the backend
  # directly, so both /api/ (backend) and /boondi-media/ (minio) are reachable through the
  # one public domain — matching what STORAGE_PUBLIC_URL assumes. Comes up automatically
  # with `docker compose up -d`. Requires NGROK_AUTHTOKEN in .env.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=capably-proving-fever.ngrok-free.dev"
      - "nginx:80"
    ports:
      - "4040:4040"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
