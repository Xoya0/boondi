events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8080;
    }

    upstream minio {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # API requests
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Uploaded media (avatars, banners, post images) — object keys already include the
        # bucket name (see application.yml storage.bucket=boondi-media), and MinIO's S3 API
        # serves objects at /<bucket>/<key>, so this proxies straight through with no rewrite.
        # Must match STORAGE_PUBLIC_URL in .env, which is the bare domain with no path suffix.
        location /boondi-media/ {
            proxy_pass http://minio;
            proxy_set_header Host $host;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://backend/api/v1/swagger-ui/;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            proxy_pass http://backend/api/v1/health;
        }

        # Static web app (served in later sprints)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
