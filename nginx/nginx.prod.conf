events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    upstream backend {
        server backend:8080;
    }

    # Plain HTTP: only used for the ACME HTTP-01 challenge (certbot) and to redirect
    # everything else to HTTPS. Never proxies API traffic in production.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Paths are bind-mounted from the host (see docker-compose.prod.yml) — populate
        # them with either certbot-issued certs or a self-signed pair for local testing
        # (openssl req -x509 -nodes -newkey rsa:2048 -keyout privkey.pem -out fullchain.pem
        # -days 365 -subj "/CN=localhost").
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API requests
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://backend/api/v1/health;
        }

        # Static web app (built by nginx/Dockerfile.prod)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # index.html itself must never be cached (it references hashed asset filenames);
            # the hashed assets under /assets/ are safe to cache long-term.
            location = /index.html {
                add_header Cache-Control "no-cache";
            }
            location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
}
