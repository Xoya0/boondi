spring:
  application:
    name: boondi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boondi}
    username: ${DB_USERNAME:boondi}
    password: ${DB_PASSWORD:boondi}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      # Must be >= the largest per-file limit enforced in code (UserService's 10MB banner
      # cap) — Spring Boot's own defaults (1MB file / 10MB request) are lower than that and
      # would reject valid banner/avatar/post-image uploads with a generic 413 before the
      # app's own size validation (and its friendlier error message) ever runs.
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # "always" would leak DB/Redis connectivity + disk-space internals to anyone hitting
      # /actuator/health — it's permitAll() in SecurityConfig (health checks can't require
      # auth) and there's no separate management port. The app's own /health endpoint
      # (HealthController) is what Docker/Nginx actually probe; actuator's health is exposed
      # only for completeness, so it doesn't need to reveal component details publicly.
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  admin:
    # Comma-separated emails of registered accounts to promote to ADMIN at startup.
    emails: ${ADMIN_EMAILS:}
  jwt:
    secret: ${JWT_SECRET:boondi-super-secret-key-change-in-production-must-be-at-least-256-bits-long}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:boondi-media}
    region: ${STORAGE_REGION:us-east-1}
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
