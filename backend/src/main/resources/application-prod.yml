springdoc:
  # Reduce public attack surface: the full API schema (including admin/report endpoints)
  # shouldn't be discoverable by anyone on the internet. Re-enable per-environment if a
  # specific deployment needs it (e.g. via SPRINGDOC_SWAGGER_UI_ENABLED=true).
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.boondi: INFO
